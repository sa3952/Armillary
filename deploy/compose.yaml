# The project name is fixed so the host's containers and network do not depend
# on the checkout's directory name.
name: armillary
services:
  armillary-app:
    # Runtime only; release images come from the governed materialized context.
    image: "armillary:${IMAGE_TAG:-local}"
    init: true
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777"
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    # Two 40-thread workers plus supervisor/init/probes with bounded headroom.
    pids_limit: 192
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    # The event log goes to the host journal, so it shares the
    # journal's bound (the host's journald drop-in) instead
    # of size-only rotation with no time limit.  verify_staging_http checks the
    # driver on the host; Gate D declares why it cannot run this driver.
    logging:
      driver: "journald"
    # Conservative process FD ceiling; leak detection remains an image test.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - "armillary-internal"
    stop_grace_period: 30s

networks:
  armillary-internal:
    internal: true
