user www-data;
worker_processes auto;
pid /run/nginx.pid;
# emerg stays.  nginx records the "worker_connections are not
# enough" alert at [alert], but [alert] and [crit] lines also carry
# "client: <address>" (for example SSL handshake failures at [crit]), and the
# privacy page promises that system logs hold no visitor address.  Connection
# exhaustion is watched through the host firewall's aggregate counters
# instead.
error_log /var/log/nginx/error.log emerg;

# An accepted connection takes a slot from
# this pool before any request exists, and every per-address limit
# (limit_conn, limit_req) runs only once a request does.  1024 per worker is
# well above a small site's peak; the host firewall caps the connections one
# source can hold before NGINX sees it.  A proxied request uses two
# descriptors (client and upstream), a static one a client socket and a file,
# so the descriptor limit is twice the connections with room for the rest.
worker_rlimit_nofile 4096;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    server_tokens off;
    sendfile off;
    tcp_nopush on;

    # The edge and the application must agree on what a path is: the bounded
    # API locations match by regex while the application classifies by exact
    # string. Path normalization is nginx's default, but a default is not a
    # decision — stated here it is verifiable, and
    # tests/deployment/test_staging_nginx_runtime.py runs this file.
    merge_slashes on;

    # Client timeouts belong to every listener, not only the apex 443
    # server; port 80, www and the ACME bootstrap used to inherit the 60 s
    # defaults.  A timed-out connection is reset rather than left lingering.
    # client_header_timeout is how long an accepted connection may hold a
    # worker slot before its request exists (nginx also times the TLS
    # handshake and the HTTP/2 preface with it), so it is the short one.
    # The others run once a request exists, where
    # limit_conn already counts the connection.
    client_body_timeout 10s;
    client_header_timeout 5s;
    keepalive_timeout 10s;
    send_timeout 30s;
    reset_timedout_connection on;

    # TLS sessions resume from a bounded server cache, never from tickets:
    # a ticket key would be one long-lived secret for every session.  Set
    # here for every server, because NGINX looks a session up in the cache
    # of the listener's default server, which refuses every handshake; a
    # cache on the named servers alone was never consulted.
    ssl_session_tickets off;
    ssl_session_cache shared:armillary_tls:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/conf.d/armillary.conf;
}
