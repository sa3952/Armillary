# Maintenance site: every request answers 503 with one static page, security.txt
# and ACME renewal keep working.  Rendered by the (private) configuration
# generator (`--profile maintenance`) in place of the site (runbook: Maintenance page).
# It loads nothing from anywhere and logs nothing about a visitor.
server {
    listen 80 default_server;
    listen 443 ssl http2 default_server;
    server_name __STAGING_SERVER_NAME__ __STAGING_WWW_SERVER_NAME__;
    ssl_certificate __TLS_CERTIFICATE_PATH__;
    ssl_certificate_key __TLS_CERTIFICATE_KEY_PATH__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20;
    access_log off;
    error_log /var/log/nginx/error.log emerg;
    server_tokens off;
    # The same transport and sniffing headers as the site, so a maintenance
    # window does not lapse HSTS or let a browser sniff the page.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 3600 always;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; try_files $uri =404; }
    location = /.well-known/security.txt {
        alias /var/www/project-armillary/.well-known/security.txt;
        default_type text/plain;
        charset utf-8;
    }
    location / {
        default_type text/html;
        return 503 '<!doctype html><html lang="zh-TW"><meta charset="utf-8"><title>維護中</title><p>服務維護中，請稍後再試。</p>';
    }
}
