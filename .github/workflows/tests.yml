name: Public source tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-source-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# pip reads no configuration file a runner image or an earlier step left.
env:
  PIP_CONFIG_FILE: /dev/null

jobs:
  hosted-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/classical-astrology-pycache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15.2"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24.22.1"
      # The hashed build backend first, then the lock without build isolation.
      - name: Install test dependencies
        run: python -m scripts.tools.install_dev_dependencies --require-system-sqlite
      - name: Public delivery
        run: python scripts/verify_delivery.py
