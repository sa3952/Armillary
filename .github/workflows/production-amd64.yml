name: Production amd64 runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/production-amd64.yml"
      - ".dockerignore"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "backend/**"
      - "deploy/**"
      - "scripts/**"
      - "third_party/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-amd64.yml"
      - ".dockerignore"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "backend/**"
      - "deploy/**"
      - "scripts/**"
      - "third_party/**"

# Repository/organization setting required before enabling this workflow:
# Actions log retention: 7 days. The workflow uploads no artifacts and prints
# only a closed summary; GitHub job logs remain a separate remote data layer.

permissions:
  contents: read

# pip reads no configuration file a runner image or an earlier step left.
env:
  PIP_CONFIG_FILE: /dev/null

concurrency:
  group: production-amd64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/classical-astrology-pycache
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The project's Python, not the runner's own (Ubuntu 24.04 ships 3.12).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14.8"

      - name: Publication boundary
        run: python3 -B -m scripts.publication.verify_publication_candidate --root .

      - name: Privacy dependency boundary
        run: python3 -m scripts.verification.verify_privacy_dependencies --check

      # verify_container_runtime reads deploy/requirements.lock with
      # `packaging`, which setup-python's interpreter does not carry: install
      # the build lock's one hashed packaging entry, and nothing else.
      - name: Lock-pinned packaging for the runtime audit
        run: |
          python3 -c 'import re,sys; from pathlib import Path; found=re.findall(r"^packaging==[^\n]*(?:\n[ \t]+--hash=sha256:[^\n]*)+", Path("deploy/build-requirements.lock").read_text(encoding="utf-8"), flags=re.M); len(found)==1 or sys.exit("build lock has no single packaging entry"); Path(sys.argv[1]).write_text(found[0]+"\n", encoding="utf-8")' "$RUNNER_TEMP/runtime-audit.lock"
          python3 -m pip install --no-deps --require-hashes --only-binary :all: --requirement "$RUNNER_TEMP/runtime-audit.lock"

      - name: Native amd64 production runtime and resilience
        run: |
          python3 -m scripts.verification.build_release_image \
            --image classical-astrology-data:ci-amd64 \
            --platform linux/amd64 \
            --purpose diagnostic \
            --evidence-dir /tmp/classical-astrology-build-evidence \
            --require-clean
          # Every flag below is one the module's parser declares; an
          # undeclared flag exits 2 before any runtime check runs.
          python3 -m scripts.verification.verify_container_runtime \
            --image classical-astrology-data:ci-amd64 \
            --platform linux/amd64 \
            --quiet

      - name: Publication boundary after hosted writers
        run: python3 -B -m scripts.publication.verify_publication_candidate --root .
